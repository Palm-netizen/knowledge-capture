name: Deploy to GitHub Pages

# Publishes:
#   /            → Knowledge Capture (Next.js static export, this repo's root app)
#   /studio/     → SUPPERPALM Content Studio (Next.js static export from content-studio/)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Knowledge Capture
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: content-studio/package-lock.json

      - name: Build Content Studio
        working-directory: content-studio
        env:
          # e.g. "/knowledge-capture" + "/studio"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/studio
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r out/. _site/
          cp -r content-studio/out _site/studio
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
